[book]
authors = ["Ryan Hill"]
language = "en"
src = "src"
title = "Signals 360"

[preprocessor.d2]
path = "d2"
layout = "elk"
inline = false
output-dir = "d2"

# Disabled: mdbook-katex 0.9.4 (nixpkgs) incompatible with mdbook 0.5.2
# Re-enable when nixpkgs updates the package
# [preprocessor.katex]

# Disabled: mdbook-mermaid has parsing issues with mdbook 0.5.x in CI
# Re-enable when adding mermaid diagrams and a compatible version is available
# [preprocessor.mermaid]
# command = "mdbook-mermaid"

[output.html]
default-theme = "light"
additional-css = ["theme/custom.css"]
additional-js = ["theme/diagrams.js"]

[output.html.print]
enable = true
