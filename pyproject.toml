[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signals"
version = "0.1.0"
description = "Uncertainty-aware column classification for metadata governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
    "pyhocon>=0.3.61",
    "scikit-learn>=1.8.0",
    "catboost>=1.2.7",
    "openai>=2.29.0",
    "cython>=3.2.4",
    "ripser>=0.6.14",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.84.0",
]
owl = [
    "owlready2>=0.50",
]
embedding = [
    "sentence-transformers>=3.3.0",
    "numpy>=1.26.0",
]
embedding-catboost = [
    "sentence-transformers>=3.3.0",
    "numpy>=1.26.0",
    "catboost>=1.2.7",
    "scikit-learn>=1.4.0",
]
viz = [
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
]
sage = [
    "sage-importance>=0.0.6",
    "numpy>=1.26.0",
]

[project.scripts]
sigint = "sigint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigint", "src/signals"]

[dependency-groups]
dev = [
    "anthropic>=0.84.0",
    "behave>=1.3.3",
    "impyla>=0.19.0",
    "kerberos>=1.3.1",  # GSSAPI for Impala HS2 (impyla/puresasl); just backup
    "numpy>=2.4.3",
    "owlready2>=0.50",
    "psycopg[binary]>=3.1",
    "pyarrow>=18.0.0",
    "pytest>=8.0",
    "requests>=2.31",
    "sage-importance>=0.0.6",
    "sentence-transformers>=3.3.0",
    "thrift-sasl>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
