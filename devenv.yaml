# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Fail `devenv up` if a required port is taken (do NOT silently bump PG 5455→5456).
# Partial stacks + auto port shifts break Impala catalogd / Atlas JDBC wiring.
# Lab lattice: signals owns 5455 (see scripts/signals_port_lattice.sh). Other
# devenvs: cybersec 5438, gaius 5444, atelier 5533, aegir 5555, synth 5566.
strictPorts: true

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # S3-compatible object store (not in nixpkgs). Pin deliberately — advance with
  # synth/vigil when upgrading. Data dir: $SIGNALS_DATA_ROOT/rustfs (RAID).
  rustfs:
    url: github:rustfs/rustfs/99701e9f52eaafecccd73b3a2a35bf66423dd4f9

# Secrets: DECLARED in secretspec.toml, PROVIDED per environment.
# dotenv (.env) is the low-friction local default (gitignored).
# Switch per machine/CI:
#   devenv --secretspec-provider env shell
#   devenv --secretspec-provider keyring --secretspec-profile stage shell
#   secretspec run -- just tag ...
# Align profile with SIGNALS_KRB_ENV (dev → DEV.VISTA.ZNDX.ORG).
# See docs/current/src/operations/secrets.md
secretspec:
  enable: true
  provider: dotenv
  profile: default

# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
