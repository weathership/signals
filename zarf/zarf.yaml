kind: ZarfPackageConfig
metadata:
  name: signals-360
  description: Air-gap deployment package for Signals 360 (Dask, gRPC Engine, JupyterHub) on RKE2
  version: "0.1.0"
  architecture: amd64
  authors: Signals 360 Team
  url: https://github.com/cldr-research/signals-360

variables:
  # Registry configuration
  - name: REGISTRY_URL
    description: External registry URL (empty = use Zarf internal registry)
    default: ""

  # Ingress configuration
  - name: INGRESS_DOMAIN
    description: Base domain for ingress hostnames
    default: signals.local

  # Dask configuration
  - name: DASK_WORKER_REPLICAS
    description: Number of Dask worker replicas
    default: "4"
  - name: DASK_SPILL_DIR
    description: Host path for Dask worker spill-to-disk
    default: /tmp/dask-spill

  # S3 storage configuration
  - name: S3_ENDPOINT
    description: S3-compatible endpoint URL
    default: ""
  - name: S3_BUCKET
    description: S3 bucket name for data
    default: "signals-360-data"
  - name: S3_REGION
    description: AWS region for S3 access
    default: "us-east-1"
  - name: S3_ACCESS_KEY
    description: S3 access key
    default: ""
    sensitive: true
  - name: S3_SECRET_KEY
    description: S3 secret key
    default: ""
    sensitive: true

components:
  # ===========================================================================
  # Core images - always included
  # ===========================================================================
  - name: signals-images
    required: true
    description: Container images for Signals 360 deployment
    images:
      - ghcr.io/dask/dask:latest
      - ghcr.io/dask/dask-kubernetes-operator:2024.1.0
      - localhost:5555/signals-engine:latest

  # ===========================================================================
  # Dask Operator - Helm chart deployment
  # ===========================================================================
  - name: dask-operator
    required: true
    description: Dask Kubernetes Operator (manages DaskCluster CRDs)
    charts:
      - name: dask-kubernetes-operator
        namespace: dask-operator
        localPath: charts/dask-kubernetes-operator-2024.1.0.tgz
        version: 2024.1.0

  # ===========================================================================
  # Dask Cluster - DaskCluster CRD manifest
  # ===========================================================================
  - name: dask-cluster
    required: true
    description: DaskCluster deployment for distributed computing
    manifests:
      - name: dask-namespaces
        files:
          - manifests/namespace.yaml
      - name: dask-cluster-cr
        files:
          - manifests/dask-cluster.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: dask.org/component=scheduler
                namespace: dask
                condition: Ready
            maxTotalSeconds: 300
            description: Wait for Dask scheduler to be ready

  # ===========================================================================
  # Signals Engine - gRPC server for agent-mediated visualization
  # ===========================================================================
  - name: signals-engine
    required: false
    default: true
    description: Signals Engine gRPC server (drives HoloViews/Datashader via terminal commands)
    manifests:
      - name: signals-engine-deployment
        files:
          - manifests/engine.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: app=signals-engine
                namespace: signals-engine
                condition: Ready

  # ===========================================================================
  # JupyterHub - optional, on by default
  # ===========================================================================
  - name: jupyterhub
    required: false
    default: true
    description: JupyterHub for interactive notebooks with Dask integration
    images:
      - quay.io/jupyterhub/k8s-hub:4.0.0
      - quay.io/jupyterhub/configurable-http-proxy:4.5.5
    charts:
      - name: jupyterhub
        namespace: jupyterhub
        localPath: charts/jupyterhub-4.0.0.tgz
        version: 4.0.0
        valuesFiles:
          - manifests/jupyterhub-values.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: component=hub
                namespace: jupyterhub
                condition: Ready

  # ===========================================================================
  # Ingress - optional, enables external access
  # ===========================================================================
  - name: ingress
    required: false
    default: true
    description: Ingress resources for external access
    manifests:
      - name: ingress-resources
        files:
          - manifests/ingress.yaml
