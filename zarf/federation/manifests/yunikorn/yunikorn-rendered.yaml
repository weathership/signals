apiVersion: v1
kind: Service
metadata:
  name: yunikorn-service
  labels:
    app: yunikorn
    chart: yunikorn-1.9.0
    release: yunikorn
    heritage: Helm
  annotations:
    # Lab: durable LAN/WARP reach without kubectl port-forward.
    # Classic :9889/:9080 also via `just yk-ui-forward` (binds 0.0.0.0).
    signals.zndx.org/expose: "lan-nodeport"
spec:
  type: NodePort
  ports:
    - port: 9080
      targetPort: http1
      protocol: TCP
      name: yunikorn-core
      nodePort: 30080
    - port: 9889
      targetPort: http2
      protocol: TCP
      name: yunikorn-service
      nodePort: 30889
  selector:
    app: yunikorn
    component: yunikorn-scheduler
    release: yunikorn
