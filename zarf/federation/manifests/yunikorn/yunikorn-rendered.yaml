apiVersion: v1
kind: ConfigMap
metadata:
  name: yunikorn-defaults
  labels:
    app: yunikorn
    chart: yunikorn-1.9.0
    release: yunikorn
    heritage: Helm
  annotations:
    "helm.sh/resource-policy": keep
data:
  admissionController.filtering.enable: "true"
  queues.yaml: |
    partitions:
      - name: default
        placementrules:
          - name: provided
            create: false
          - name: fixed
            value: root.default
            create: false
        queues:
          - name: root
            submitacl: '*'
            queues:
              - name: default
                submitacl: '*'
