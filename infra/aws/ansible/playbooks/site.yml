---
# Full stack deployment: RKE2 + Dask + Signals Engine + Ingress
# Usage: ansible-playbook playbooks/site.yml

- name: Prepare all nodes
  hosts: rke2
  become: true
  roles:
    - common

- name: Install RKE2 server (first control plane)
  hosts: control_plane[0]
  become: true
  vars:
    rke2_role: server
    rke2_is_first_server: true
  roles:
    - rke2-server

- name: Install RKE2 server (additional control planes)
  hosts: control_plane[1:]
  become: true
  serial: 1
  vars:
    rke2_role: server
    rke2_is_first_server: false
  roles:
    - rke2-server

- name: Install RKE2 agent (workers)
  hosts: workers
  become: true
  vars:
    rke2_role: agent
  roles:
    - rke2-agent

- name: Deploy Dask operator and cluster
  hosts: control_plane[0]
  become: true
  roles:
    - dask

- name: Deploy Signals Engine
  hosts: control_plane[0]
  become: true
  roles:
    - role: signals-engine
      tags: [signals-engine, engine]

- name: Deploy JupyterHub
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: jupyterhub
      tags: [jupyterhub]

- name: Configure ingress tunnels
  hosts: control_plane[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: cloudflare-tunnel
      tags: [cloudflare, ingress]
