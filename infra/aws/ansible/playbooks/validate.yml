---
# Validate deployment E2E
# Usage: ansible-playbook playbooks/validate.yml

- name: Validate Signals 360 Deployment
  hosts: control_plane[0]
  gather_facts: true
  tasks:
    - name: Check RKE2 cluster health
      command: kubectl get nodes -o wide
      register: nodes_status
      changed_when: false

    - name: Display cluster nodes
      debug:
        msg: "{{ nodes_status.stdout_lines }}"

    - name: Verify all nodes Ready
      assert:
        that:
          - "'Ready' in nodes_status.stdout"
        fail_msg: "Not all nodes are Ready"

    - name: Check Dask scheduler pod
      command: >
        kubectl get pods -n {{ dask_namespace | default('dask') }}
        -l dask.org/component=scheduler
        -o jsonpath='{.items[0].status.phase}'
      register: scheduler_status
      changed_when: false
      ignore_errors: true

    - name: Check Dask worker pods
      command: >
        kubectl get pods -n {{ dask_namespace | default('dask') }}
        -l dask.org/component=worker --no-headers
      register: worker_pods
      changed_when: false
      ignore_errors: true

    - name: Count running Dask workers
      set_fact:
        worker_count: "{{ worker_pods.stdout_lines | length }}"
      when: worker_pods.rc == 0

    - name: Check Signals Engine pod
      command: >
        kubectl get pods -n signals-engine
        -l app=signals-engine
        -o jsonpath='{.items[0].status.phase}'
      register: engine_status
      changed_when: false
      ignore_errors: true

    - name: Check JupyterHub hub pod
      command: >
        kubectl get pods -n {{ jupyterhub_namespace | default('jupyterhub') }}
        -l component=hub
        -o jsonpath='{.items[0].status.phase}'
      register: hub_status
      changed_when: false
      ignore_errors: true

    - name: Check Cloudflare Tunnel
      command: >
        kubectl get pods -n cloudflare-system
        -l app.kubernetes.io/name=cloudflared
        -o jsonpath='{.items[0].status.phase}'
      register: tunnel_status
      changed_when: false
      ignore_errors: true

    - name: Display validation summary
      debug:
        msg: |
          ============================================
                    VALIDATION SUMMARY
          ============================================

          CLUSTER STATUS
          --------------
          Nodes: {{ nodes_status.stdout_lines | length - 1 }} node(s) in cluster

          DASK COMPONENTS
          ---------------
          Scheduler: {{ scheduler_status.stdout | default('NOT FOUND') }}
          Workers: {{ worker_count | default('0') }} running

          SIGNALS ENGINE
          --------------
          Engine: {{ engine_status.stdout | default('NOT DEPLOYED') }}

          JUPYTERHUB
          ----------
          Hub Pod: {{ hub_status.stdout | default('NOT DEPLOYED') }}

          CLOUDFLARE TUNNEL
          -----------------
          Tunnel: {{ tunnel_status.stdout | default('NOT DEPLOYED') }}

          ============================================

    - name: Fail if critical components missing
      assert:
        that:
          - scheduler_status.stdout == 'Running' or scheduler_status.rc != 0
          - worker_count | default(0) | int >= 1 or worker_pods.rc != 0
        fail_msg: "Critical Dask components not running"
      when: scheduler_status.rc == 0 and worker_pods.rc == 0
