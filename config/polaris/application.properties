# Apache Polaris - Iceberg REST Catalog
# Backed by PostgreSQL for persistence

# Persistence
POLARIS_PERSISTENCE_TYPE=relational-jdbc
QUARKUS_DATASOURCE_DB_KIND=postgresql
QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5455/polaris
QUARKUS_DATASOURCE_USERNAME=
QUARKUS_DATASOURCE_PASSWORD=

# HTTP server
QUARKUS_HTTP_PORT=8181

# Catalog defaults
POLARIS_DEFAULT_REALM=signals
# Warehouse objects live on RustFS. pglite JDBC above is catalog metadata only.
POLARIS_FEATURES_DEFAULTS_TABLE_DEFAULT_BASE_LOCATION=s3://signals-dataproducts/iceberg
