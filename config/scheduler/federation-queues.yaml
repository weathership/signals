# Resource-class federation queues (YuniKorn lab backend).
# SoR for live policy. Promote via engine:
#   uv run python -m signals.cli.yk write-scratch config/scheduler/federation-queues.yaml
#   uv run python -m signals.cli.yk promote --dry-run
#   uv run python -m signals.cli.yk promote
#
# Queue path = scarcity / resource class. Project is identity
# (federation.project label, C2 routing, Engine/Yield), not a parent.
# GPU occupancy key is federation.zndx.org/gpu (claim token). Do not put
# nvidia.com/gpu on host-engine sentinels — that binds the card into the
# empty pod. In-cluster CUDA pods request both keys.
#
# Lab GPU pool: 6 × RTX 4090 on tinybox. Standing heavy=4; leftover pair is
# extract vs light/CLT or medium/SAE. Peers send RequestQueueShare; Signals
# merges RECORDED floors (parent max 6) and PromoteScratch applies
# yunikorn-configs. Peers never write this file.
# Catalog for peers: each leaf's properties.federation.* (MCP later).
partitions:
  - name: default
    preemption:
      enabled: true
    placementrules:
      - name: provided
        create: false
      - name: fixed
        value: root.default
        create: false
    queues:
      - name: root
        parent: true
        submitacl: '*'
        queues:
          - name: default
            submitacl: '*'
            properties:
              federation.class: default
              federation.yk_enforces: memory,vcore,maxapplications
              federation.peer_meters: ""
              federation.examples: unannotated;autogen;leftover
            resources:
              max:
                memory: 64G
                vcore: 16
                federation.zndx.org/gpu: "0"
            maxapplications: 64

          - name: platform
            submitacl: '*'
            properties:
              federation.class: platform
              federation.yk_enforces: memory,vcore,maxapplications
              federation.peer_meters: ""
              federation.examples: metaflow-service;airflow;eventing;signals-c2-adjacent
            resources:
              max:
                memory: 64G
                vcore: 16
                federation.zndx.org/gpu: "0"
            maxapplications: 32

          - name: internal
            parent: true
            submitacl: '*'
            resources:
              max:
                memory: 512G
                vcore: 96
                federation.zndx.org/gpu: "6"
            queues:
              - name: compute
                submitacl: '*'
                properties:
                  federation.class: internal.compute
                  federation.yk_enforces: memory,vcore,maxapplications
                  federation.peer_meters: ""
                  federation.examples: cpu-burst;yield-proof;minifi-idle;gaius.ambient
                resources:
                  max:
                    memory: 128G
                    vcore: 32
                    federation.zndx.org/gpu: "0"
                maxapplications: 8

              - name: inference
                parent: true
                submitacl: '*'
                properties:
                  federation.class: internal.inference
                  federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                  federation.peer_meters: ""
                  federation.examples: parent-share;do-not-submit-here
                  # Light must not walk out and preempt heavy (27B / TP=4).
                  preemption.policy: fence
                resources:
                  max:
                    memory: 400G
                    vcore: 64
                    federation.zndx.org/gpu: "6"
                queues:
                  - name: heavy
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.heavy
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.thinking;tp4-27b
                      # Interactive light must not preempt this leaf.
                      preemption.policy: fence
                    resources:
                      guaranteed:
                        federation.zndx.org/gpu: "4"
                      max:
                        federation.zndx.org/gpu: "4"
                    # One 27B TP=4. A second heavy is 8 GPUs — will not fit.
                    maxapplications: 1

                  - name: light
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.light
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.ask-agent;1.7b
                      preemption.delay: 5s
                    resources:
                      # No standing floor. Shares leftover 2 with extract / on-demand SAE.
                      guaranteed:
                        federation.zndx.org/gpu: "0"
                      max:
                        federation.zndx.org/gpu: "2"
                    maxapplications: 2

                  - name: medium
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.medium
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.ask-sae;9b-tp2
                      preemption.delay: 5s
                    resources:
                      # On-demand SAE TP=2 only when exploring SAE — not standing.
                      guaranteed:
                        federation.zndx.org/gpu: "0"
                      max:
                        federation.zndx.org/gpu: "2"
                    maxapplications: 1

                  - name: reasoning
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.reasoning
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.reasoning;chat-cot
                    maxapplications: 4

                  - name: coding
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.coding
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.coding;code-model
                    maxapplications: 4

                  - name: orchestration
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.orchestration
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.orchestration;planner;tool-router
                    maxapplications: 8

                  - name: instruct
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.instruct
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.instruct;aegir.instruct;short-chat
                    maxapplications: 8

                  - name: embedding
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.embedding
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.text_embedding;atelier.embed
                    maxapplications: 8

                  - name: extract
                    submitacl: '*'
                    properties:
                      federation.class: internal.inference.extract
                      federation.yk_enforces: memory,vcore,federation.zndx.org/gpu,maxapplications
                      federation.peer_meters: ""
                      federation.examples: gaius.extract;atelier.ocr;docling
                      preemption.delay: 5s
                    # Floor of 1 GPU so standing ask-sae (medium, no guarantee)
                    # is preempted when article-curate / docling arrives.
                    # Thinking keeps 4; leftover 2 is extract+light/medium.
                    resources:
                      guaranteed:
                        federation.zndx.org/gpu: "1"
                      max:
                        federation.zndx.org/gpu: "2"
                    maxapplications: 2

          - name: external
            parent: true
            submitacl: '*'
            resources:
              max:
                memory: 32G
                vcore: 16
                federation.zndx.org/gpu: "0"
            queues:
              - name: token-metered
                submitacl: '*'
                properties:
                  federation.class: external.token-metered
                  federation.yk_enforces: memory,vcore,maxapplications
                  federation.peer_meters: tokens
                  federation.examples: openai-class;pay-per-token
                maxapplications: 16

              - name: rate-metered
                submitacl: '*'
                properties:
                  federation.class: external.rate-metered
                  federation.yk_enforces: memory,vcore,maxapplications
                  federation.peer_meters: rpm
                  federation.examples: rpm-tpm-limited-api
                maxapplications: 16

              - name: subscription
                parent: true
                submitacl: '*'
                resources:
                  max:
                    memory: 16G
                    vcore: 8
                    federation.zndx.org/gpu: "0"
                queues:
                  - name: rate-limited
                    submitacl: '*'
                    properties:
                      federation.class: external.subscription.rate-limited
                      federation.yk_enforces: memory,vcore,maxapplications
                      federation.peer_meters: subscription
                      federation.examples: grok-acp;xai-subscription
                    maxapplications: 8
