# Iceberg REST catalog via Apache Polaris (warehouse on RustFS)
connector.name=iceberg
iceberg.catalog.type=rest
uri=http://localhost:8181/api/catalog
warehouse=signals
iceberg.rest-catalog.warehouse=signals
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=admin:admin
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
oauth2-server-uri=http://localhost:8181/api/catalog/v1/oauth/tokens
