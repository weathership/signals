# Phase-1 bootstrap log4j for embedded JVM (libhdfs CreateJavaVM / hdfsConnect).
#
# Do NOT use org.apache.impala.util.GlogAppender here: it needs NativeLogger
# JNI (RegisterNatives in InitJvmLoggingSupport) which runs only after
# JniUtil::Init. Early GlogAppender init → GetStaticMethodID SEGV in libhdfs.
#
# Phase-2 (automatic): after natives are registered, JniCatalog / JniFrontend
# call GlogAppender.Install() which reconfigures log4j root → glog appender.
# Verify in catalogd INFO: "Logging (re)initialized. Impala: INFO, ..."
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n
