# Lab defaults — override via bootstrap env before apply (see scripts/metaflow_platform_bootstrap.sh).
apiVersion: v1
kind: Secret
metadata:
  name: metaflow-db
  namespace: metaflow
  labels:
    app.kubernetes.io/name: metaflow-service
type: Opaque
stringData:
  MF_METADATA_DB_USER: "metaflow"
  MF_METADATA_DB_PSWD: "metaflow"
  MF_METADATA_DB_NAME: "metaflow"
---
apiVersion: v1
kind: Secret
metadata:
  name: metaflow-s3-credentials
  namespace: metaflow
  labels:
    app.kubernetes.io/name: metaflow-service
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "rustfsadmin"
  AWS_SECRET_ACCESS_KEY: "rustfsadmin"
  AWS_ENDPOINT_URL_S3: "http://signals-rustfs.metaflow.svc.cluster.local:9010"
