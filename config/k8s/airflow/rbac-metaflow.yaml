# Allow Airflow scheduler (LocalExecutor + KPO) to launch pods in ns/metaflow.
# Chart RBAC covers ns/airflow only when multiNamespaceMode=false.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
  namespace: metaflow
  labels:
    app.kubernetes.io/part-of: signals-platform
    signals.zndx.org/component: airflow
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-scheduler-metaflow
  namespace: metaflow
  labels:
    app.kubernetes.io/part-of: signals-platform
    signals.zndx.org/component: airflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-launcher
subjects:
  # useStandardNaming: true → airflow-scheduler SA in ns/airflow
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
  - kind: ServiceAccount
    name: airflow-worker
    namespace: airflow
  - kind: ServiceAccount
    name: airflow-api-server
    namespace: airflow
