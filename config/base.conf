# signals-360 pipeline configuration
#
# This file is the single source of truth for all application config.
# All application code reads config exclusively through PipelineConfig
# (via load_config()). No module should access os.environ directly.
# Environment variables are captured here via ${?VAR} substitution.
#
# Precedence: CLI args > env vars > these defaults.
#
# Copy .env.example to .env, uncomment and edit as needed.
# devenv shell loads .env automatically (dotenv.enable = true).

# ── Infrastructure ────────────────────────────────────────────────

impala {
  host = "127.0.0.1"
  host = ${?SIGINT_IMPALA_HOST}
  port = 21050
  port = ${?SIGINT_IMPALA_PORT}
}

atlas {
  url = "http://localhost:21000"
  url = ${?SIGINT_ATLAS_URL}
  user = "admin"
  user = ${?SIGINT_ATLAS_USER}
  password = "admin"
  password = ${?SIGINT_ATLAS_PASSWORD}
  cluster_name = "signals"
  cluster_name = ${?SIGINT_CLUSTER_NAME}
}

# ── Sampling ──────────────────────────────────────────────────────

sampling {
  size = 50
  size = ${?SIGINT_SAMPLE_SIZE}
  strategy = "head"
  strategy = ${?SIGINT_SAMPLE_STRATEGY}
}

# ── Classification ────────────────────────────────────────────────

classifier {
  type = "embedding"
  type = ${?SIGINT_CLASSIFIER_TYPE}
  confidence_threshold = 0.3
  confidence_threshold = ${?SIGINT_CONFIDENCE_THRESHOLD}
  name_match_boost = true
  name_match_boost = ${?SIGINT_NAME_MATCH_BOOST}
  dry_run = false
  dry_run = ${?SIGINT_DRY_RUN}
}

# ── Embedding model ──────────────────────────────────────────────

embedding {
  model = "all-MiniLM-L6-v2"
  model = ${?SIGINT_EMBEDDING_MODEL}
  model_path = null
  model_path = ${?SIGINT_MODEL_PATH}
  cache_dir = "build/models"
  cache_dir = ${?SIGINT_EMBEDDING_CACHE_DIR}
  include_values = true
  include_values = ${?SIGINT_EMBEDDING_INCLUDE_VALUES}
  device = "auto"
  device = ${?SIGINT_DEVICE}
  batch_size = 32
  batch_size = ${?SIGINT_BATCH_SIZE}
}

# ── LLM classifier ───────────────────────────────────────────────

llm {
  api_key = null
  api_key = ${?ANTHROPIC_API_KEY}
  model = "claude-opus-4-6"
  model = ${?SIGINT_LLM_MODEL}
}

# ── Taxonomy ──────────────────────────────────────────────────────
#
# name: "sigdg" (default BFO-grounded ontology)
#       "annotations" (from external CSV, requires annotations_path)
#       custom name defined in taxonomy_file
#
# taxonomy_file: path to a Python module exporting *_category_set()

taxonomy {
  name = "sigdg"
  name = ${?SIGINT_TAXONOMY}
  hierarchical = true
  hierarchical = ${?SIGINT_HIERARCHICAL}
  annotations_path = null
  annotations_path = ${?SIGINT_ANNOTATIONS_PATH}
  taxonomy_file = null
  taxonomy_file = ${?SIGINT_TAXONOMY_FILE}
}

# ── Vocabulary mapping ───────────────────────────────────────────
#
# Maps between a user's controlled vocabulary and SIGDG codes.
# mapping_file is a JSON file: {"mappings": {"UserLabel": "SIGDG:XXXX"}}

vocabulary_mapping {
  enabled = false
  enabled = ${?SIGINT_VOCAB_MAPPING_ENABLED}
  mapping_file = null
  mapping_file = ${?SIGINT_VOCAB_MAPPING_FILE}
}

# ── SAGE analysis ─────────────────────────────────────────────────

sage {
  permutations = 512
  permutations = ${?SIGINT_SAGE_PERMUTATIONS}
}

# ── CatBoost ML ───────────────────────────────────────────────────

ml {
  folds = 5
  folds = ${?SIGINT_ML_FOLDS}
  train_dir = null
  train_dir = ${?SIGINT_TRAIN_DIR}
  concat_features = true
  concat_features = ${?SIGINT_CONCAT_FEATURES}
}

# ── Data paths ────────────────────────────────────────────────────

data {
  dir = null
  dir = ${?SIGINT_DATA_DIR}
  input_format = "csv"
  input_format = ${?SIGINT_INPUT_FORMAT}
  ground_truth = null
  ground_truth = ${?SIGINT_GROUND_TRUTH}
  output = "build/sigint_embeddings.parquet"
  output = ${?SIGINT_OUTPUT}
}

# ── Scope (for live Impala tagging) ───────────────────────────────

scope {
  databases = ["default"]
  tables = []
}
