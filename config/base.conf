# signals-360 pipeline configuration
#
# This file is the single source of truth for all application config.
# All application code reads config exclusively through PipelineConfig
# (via load_config()). No module should access os.environ directly.
# Environment variables are captured here via ${?VAR} substitution.
#
# Precedence: CLI args > env vars > these defaults.
#
# Copy .env.example to .env, uncomment and edit as needed.
# devenv shell loads .env automatically (dotenv.enable = true).

# ── Infrastructure ────────────────────────────────────────────────

impala {
  # Kerberos SPN host (FQDN). Never 127.0.0.1 — use IMPALA_HS2_HOST / SIGNALS_KRB_HOST.
  host = "tinybox.dev.vista.zndx.org"
  host = ${?IMPALA_HS2_HOST}
  host = ${?SIGNALS_KRB_HOST}
  host = ${?SIGINT_IMPALA_HOST}
  port = 21050
  port = ${?IMPALA_HS2_PORT}
  port = ${?SIGINT_IMPALA_PORT}
}

atlas {
  url = "http://localhost:21010"
  url = ${?SIGINT_ATLAS_URL}
  user = "admin"
  user = ${?SIGINT_ATLAS_USER}
  password = "admin"
  password = ${?SIGINT_ATLAS_PASSWORD}
  cluster_name = "signals"
  cluster_name = ${?SIGINT_CLUSTER_NAME}
}

# ── Sampling ──────────────────────────────────────────────────────

sampling {
  size = 50
  size = ${?SIGINT_SAMPLE_SIZE}
  strategy = "head"
  strategy = ${?SIGINT_SAMPLE_STRATEGY}
}

# ── Classification ────────────────────────────────────────────────

classifier {
  type = "embedding"
  type = ${?SIGINT_CLASSIFIER_TYPE}
  confidence_threshold = 0.3
  confidence_threshold = ${?SIGINT_CONFIDENCE_THRESHOLD}
  name_match_boost = true
  name_match_boost = ${?SIGINT_NAME_MATCH_BOOST}
  dry_run = false
  dry_run = ${?SIGINT_DRY_RUN}
}

# ── Embedding model ──────────────────────────────────────────────

embedding {
  model = "all-MiniLM-L6-v2"
  model = ${?SIGINT_EMBEDDING_MODEL}
  model_path = null
  model_path = ${?SIGINT_MODEL_PATH}
  # Prefer host/RAID: SENTENCE_TRANSFORMERS_HOME or SIGINT_EMBEDDING_CACHE_DIR.
  # Tree-local build/models is last-resort only (portable / no RAID).
  cache_dir = "build/models"
  cache_dir = ${?SENTENCE_TRANSFORMERS_HOME}
  cache_dir = ${?SIGINT_EMBEDDING_CACHE_DIR}
  include_values = true
  include_values = ${?SIGINT_EMBEDDING_INCLUDE_VALUES}
  device = "auto"
  device = ${?SIGINT_DEVICE}
  batch_size = 32
  batch_size = ${?SIGINT_BATCH_SIZE}
}

# ── LLM classifier ───────────────────────────────────────────────

llm {
  api_key = null
  api_key = ${?ANTHROPIC_API_KEY}
  model = "claude-opus-4-6"
  model = ${?SIGINT_LLM_MODEL}
}

# ── Taxonomy ──────────────────────────────────────────────────────
#
# name: "sigdg" (default BFO-grounded ontology)
#       "annotations" (from external CSV, requires annotations_path)
#       custom name defined in taxonomy_file
#
# taxonomy_file: path to a Python module exporting *_category_set()

taxonomy {
  name = "sigdg"
  name = ${?SIGINT_TAXONOMY}
  hierarchical = true
  hierarchical = ${?SIGINT_HIERARCHICAL}
  annotations_path = null
  annotations_path = ${?SIGINT_ANNOTATIONS_PATH}
  taxonomy_file = null
  taxonomy_file = ${?SIGINT_TAXONOMY_FILE}
}

# ── Vocabulary mapping ───────────────────────────────────────────
#
# Maps between a user's controlled vocabulary and SIGDG codes.
# mapping_file is a JSON file: {"mappings": {"UserLabel": "SIGDG:XXXX"}}

vocabulary_mapping {
  enabled = false
  enabled = ${?SIGINT_VOCAB_MAPPING_ENABLED}
  mapping_file = null
  mapping_file = ${?SIGINT_VOCAB_MAPPING_FILE}
}

# ── SAGE analysis ─────────────────────────────────────────────────

sage {
  permutations = 512
  permutations = ${?SIGINT_SAGE_PERMUTATIONS}
}

# ── SHAP item-wise explanations ──────────────────────────────────
#
# Per-item top-3 feature explanations using CatBoost TreeSHAP.
# Runs automatically when CatBoost train→eval is active.

shap {
  enabled = true
  enabled = ${?SIGINT_SHAP_ENABLED}
}

# ── SVM classifier (5th DST evidence source) ─────────────────────
#
# TF-IDF + LinearSVC with Platt scaling.  Operates on sparse lexical
# features (character/word n-grams), architecturally independent from
# the dense embedding used by cosine and CatBoost sources.
# Always active — no enable flag; SVM participates in DST whenever
# a trained model is available (svm.model_path).

svm {
  model_path = null
  model_path = ${?SIGINT_SVM_MODEL_PATH}
  discount = 0.20
  discount = ${?SIGINT_SVM_DISCOUNT}
}

# ── GPU acceleration ──────────────────────────────────────────────
#
# device: "auto" probes CUDA at startup, "cuda" forces GPU, "cpu" forces CPU.
# CatBoost and SentenceTransformer both use this setting.
# Preflight validates driver/PyTorch CUDA version compatibility.
# Requires NVIDIA driver ≥570 for PyTorch 2.10+ (CUDA 12.8).

gpu {
  devices = "0"
  devices = ${?SIGINT_GPU_DEVICES}
}

# ── CatBoost ML ───────────────────────────────────────────────────

ml {
  folds = 5
  folds = ${?SIGINT_ML_FOLDS}
  train_dir = null
  train_dir = ${?SIGINT_TRAIN_DIR}
  concat_features = true
  concat_features = ${?SIGINT_CONCAT_FEATURES}
  auto_generate = false
  auto_generate = ${?SIGINT_AUTO_GENERATE}
  variants_per_category = 50
  variants_per_category = ${?SIGINT_VARIANTS_PER_CATEGORY}
  self_train = false
  self_train = ${?SIGINT_SELF_TRAIN}
  self_train_rounds = 1
  self_train_rounds = ${?SIGINT_SELF_TRAIN_ROUNDS}
  self_train_threshold = 0.80
  self_train_threshold = ${?SIGINT_SELF_TRAIN_THRESHOLD}
}

# ── Bootstrap agent ───────────────────────────────────────────────
#
# LLM-driven outer loop for classifying novel tables without ground truth.
# Uses DST conflict K as convergence signal: high-K columns are revisited
# by the LLM with enriched ML context until joint agreement is reached.
# Output is a ground truth JSON compatible with --ground-truth / --self-train.

bootstrap {
  max_iterations = 5
  max_iterations = ${?SIGINT_BOOTSTRAP_MAX_ITERATIONS}
  k_threshold = 0.2
  k_threshold = ${?SIGINT_BOOTSTRAP_K_THRESHOLD}
  uncertainty_gap_threshold = 0.3
  uncertainty_gap_threshold = ${?SIGINT_BOOTSTRAP_UNCERTAINTY_GAP_THRESHOLD}
  coverage_target = 0.95
  coverage_target = ${?SIGINT_BOOTSTRAP_COVERAGE_TARGET}
  confidence_floor = 0.5
  confidence_floor = ${?SIGINT_BOOTSTRAP_CONFIDENCE_FLOOR}
  initial_sample_fraction = 0.3
  initial_sample_fraction = ${?SIGINT_BOOTSTRAP_INITIAL_SAMPLE_FRACTION}
  propagation_similarity = 0.85
  propagation_similarity = ${?SIGINT_BOOTSTRAP_PROPAGATION_SIMILARITY}
  max_llm_calls_per_iteration = 500
  max_llm_calls_per_iteration = ${?SIGINT_BOOTSTRAP_MAX_LLM_CALLS_PER_ITERATION}
  max_total_llm_calls = 5000
  max_total_llm_calls = ${?SIGINT_BOOTSTRAP_MAX_TOTAL_LLM_CALLS}
  columns_per_call = 50
  columns_per_call = ${?SIGINT_BOOTSTRAP_COLUMNS_PER_CALL}
  output = "build/bootstrap_gt.json"
  output = ${?SIGINT_BOOTSTRAP_OUTPUT}
  llm_backend = "cerebras"
  llm_backend = ${?SIGINT_BOOTSTRAP_LLM_BACKEND}
  llm_api_key = null
  llm_api_key = ${?CEREBRAS_API_KEY}
  llm_api_key = ${?SIGINT_BOOTSTRAP_LLM_API_KEY}
  llm_base_url = null
  llm_base_url = ${?SIGINT_BOOTSTRAP_LLM_BASE_URL}
  llm_model = ${llm.model}
  llm_model = ${?SIGINT_BOOTSTRAP_LLM_MODEL}
  llm_max_tokens = 65536
  llm_max_tokens = ${?SIGINT_BOOTSTRAP_LLM_MAX_TOKENS}
  llm_discount = 0.10
  llm_discount = ${?SIGINT_BOOTSTRAP_LLM_DISCOUNT}
  table_aware_batching = true
  table_aware_batching = ${?SIGINT_TABLE_AWARE_BATCHING}
}

# ── Data paths ────────────────────────────────────────────────────

data {
  dir = null
  dir = ${?SIGINT_DATA_DIR}
  input_format = "csv"
  input_format = ${?SIGINT_INPUT_FORMAT}
  ground_truth = null
  ground_truth = ${?SIGINT_GROUND_TRUTH}
  output = "build/sigint_embeddings.parquet"
  output = ${?SIGINT_OUTPUT}
}

# ── Scope (for live Impala tagging) ───────────────────────────────

scope {
  databases = ["default"]
  tables = []
}
