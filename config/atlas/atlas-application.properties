#########  Graph Database Configs  #########

# Apache AGE (PostgreSQL) backend
atlas.graphdb.backend=org.apache.atlas.repository.graphdb.age.AtlasAgeGraphDatabase
atlas.age.jdbc.url=jdbc:postgresql://localhost:5455/signals
atlas.age.jdbc.user=${sys:user.name}
atlas.age.jdbc.password=
atlas.age.graph.name=atlas_graph
atlas.age.pool.size=50

# Graph Storage
atlas.graph.storage.backend=age
#AGE graph storage via PostgreSQL + Apache AGE

# Graph Search Index
atlas.graph.index.search.backend=age
#AGE uses PostgreSQL full-text indexing

# Gremlin search disabled — AGE uses SQL-based traversal
atlas.search.gremlin.enable=false

# Entity audit repository — disabled (no HBase)
atlas.EntityAuditRepository.impl=org.apache.atlas.repository.audit.NoopEntityAuditRepository

#########  Notification Configs  #########
atlas.notification.embedded=false
atlas.notification.consumer.disabled=true
atlas.kafka.data=${sys:atlas.home}/data/kafka
atlas.kafka.zookeeper.connect=localhost:9026
atlas.kafka.bootstrap.servers=localhost:9027
atlas.kafka.zookeeper.session.timeout.ms=400
atlas.kafka.zookeeper.connection.timeout.ms=200
atlas.kafka.zookeeper.sync.time.ms=20
atlas.kafka.auto.commit.interval.ms=1000
atlas.kafka.hook.group.id=atlas

atlas.kafka.enable.auto.commit=false
atlas.kafka.auto.offset.reset=earliest
atlas.kafka.session.timeout.ms=30000
atlas.kafka.offsets.topic.replication.factor=1
atlas.kafka.poll.timeout.ms=1000
# Fast-fail Kafka producer when broker is unavailable (default 60s blocks entity creation)
atlas.kafka.max.block.ms=1000
atlas.kafka.request.timeout.ms=1000
atlas.kafka.delivery.timeout.ms=2000

atlas.notification.create.topics=true
atlas.notification.replicas=1
atlas.notification.topics=ATLAS_HOOK,ATLAS_ENTITIES
atlas.notification.log.failed.messages=true
atlas.notification.consumer.retry.interval=500
atlas.notification.hook.retry.interval=1000

## Server port configuration
atlas.server.http.port=21000
#atlas.server.https.port=21443

#########  Security Properties  #########

# SSL config
atlas.enableTLS=false

# Authentication config
atlas.authentication.method.kerberos=false
atlas.authentication.method.file=true
atlas.authentication.method.ldap.type=none
atlas.authentication.method.file.filename=${sys:atlas.home}/conf/users-credentials.properties

#########  Server Properties  #########
atlas.rest.address=http://localhost:21000

#########  High Availability Configuration ########
atlas.server.ha.enabled=false

######### Atlas Authorization #########
atlas.authorizer.impl=simple
atlas.authorizer.simple.authz.policy.file=atlas-simple-authz-policy.json

#########  CSRF Configs  #########
atlas.rest-csrf.enabled=true
atlas.rest-csrf.browser-useragents-regex=^Mozilla.*,^Opera.*,^Chrome.*
atlas.rest-csrf.methods-to-ignore=GET,OPTIONS,HEAD,TRACE
atlas.rest-csrf.custom-header=X-XSRF-HEADER

############ Atlas Metric/Stats configs ################
atlas.metric.query.cache.ttlInSecs=900
