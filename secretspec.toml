# Declared secrets — values never live here (https://secretspec.dev/).
# Each environment picks a provider: dotenv (.env) locally by default,
# keyring / 1password / sops / env in CI. devenv wires this via the
# secretspec block in devenv.yaml.
#
# Non-secret identity shape stays in devenv.nix:
#   KRB5_REALM, SIGNALS_KRB_ENV, SIGNALS_KRB_LOCATION, SIGNALS_KRB_HOST
# Align SecretSpec profile with SIGNALS_KRB_ENV when multi-profiling
# (e.g. profile "dev" ↔ realm DEV.VISTA.ZNDX.ORG).
#
# Prefer: secretspec run -- <cmd>  for jobs that need secrets without
# permanently exporting them into the interactive shell.

[project]
name = "signals"
revision = "1.0"

# ── default / local devenv ─────────────────────────────────────────
# Keytabs optional: pure local can mint them with `just kdc-reset` into
# .devenv/kdc/ and point paths here via .env only when overriding.

[profiles.default]
# Kerberos material (paths or provider file refs — not TGTs)
SIGNALS_KRB_USER_KEYTAB = { description = "Client keytab for signals@DEV.VISTA.ZNDX.ORG (or env realm); path for FDW/headless kinit", required = false }
POSTGRES_KRB_KEYTAB = { description = "Server keytab postgres/<host>@REALM for PG GSSAPI", required = false }
IMPALA_KRB_KEYTAB = { description = "Service keytab impala/<host>@REALM", required = false }
KUDU_KRB_KEYTAB = { description = "Service keytab kudu/<host>@REALM", required = false }
HTTP_KRB_KEYTAB = { description = "Service keytab HTTP/<host>@REALM (Atlas/Ranger SPNEGO)", required = false }

# Pipeline / LLM (also captured by HOCON ${?VAR})
ANTHROPIC_API_KEY = { description = "Anthropic API key for LLM classifier/bootstrap", required = false }
CEREBRAS_API_KEY = { description = "Cerebras Cloud API key for bootstrap LLM", required = false }
SIGINT_ATLAS_PASSWORD = { description = "Atlas REST password (default admin in devenv)", required = false }
SIGINT_BOOTSTRAP_LLM_API_KEY = { description = "Override bootstrap LLM API key", required = false }

# ── dev profile (alias of default shape; use when secretspec profile=dev) ─
[profiles.dev]
SIGNALS_KRB_USER_KEYTAB = { description = "Client keytab for signals@DEV.VISTA.ZNDX.ORG", required = false }
POSTGRES_KRB_KEYTAB = { description = "postgres/<host>@DEV.VISTA.ZNDX.ORG keytab path", required = false }
IMPALA_KRB_KEYTAB = { description = "impala/<host>@DEV.VISTA.ZNDX.ORG keytab path", required = false }
KUDU_KRB_KEYTAB = { description = "kudu/<host>@DEV.VISTA.ZNDX.ORG keytab path", required = false }
HTTP_KRB_KEYTAB = { description = "HTTP/<host>@DEV.VISTA.ZNDX.ORG keytab path", required = false }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = false }
CEREBRAS_API_KEY = { description = "Cerebras API key", required = false }
SIGINT_ATLAS_PASSWORD = { description = "Atlas REST password", required = false }
SIGINT_BOOTSTRAP_LLM_API_KEY = { description = "Bootstrap LLM API key override", required = false }

# ── stage (example second env segment — STAGE.VISTA.ZNDX.ORG) ──────
[profiles.stage]
SIGNALS_KRB_USER_KEYTAB = { description = "Client keytab for signals@STAGE.VISTA.ZNDX.ORG", required = false }
POSTGRES_KRB_KEYTAB = { description = "postgres keytab for stage realm", required = false }
IMPALA_KRB_KEYTAB = { description = "impala keytab for stage realm", required = false }
KUDU_KRB_KEYTAB = { description = "kudu keytab for stage realm", required = false }
HTTP_KRB_KEYTAB = { description = "HTTP keytab for stage realm", required = false }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = false }
CEREBRAS_API_KEY = { description = "Cerebras API key", required = false }
SIGINT_ATLAS_PASSWORD = { description = "Atlas REST password", required = false }
SIGINT_BOOTSTRAP_LLM_API_KEY = { description = "Bootstrap LLM API key override", required = false }
